name: 3. Backtest Engine
on:
  workflow_run:
    workflows: ["1. Hive Mind Engine"]
    types:
      - completed

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Backtester
        run: python backtest_engine.py
        
      - name: Safe Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add backtest_metrics.json backtest_chart.png || true
          git commit -m "📈 Update Backtest Metrics" || echo "No changes"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break || sleep 10; done
